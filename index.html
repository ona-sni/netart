<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renovación de la Mente - Red Neuronal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor principal -->
    <div id="app-container">
        
        <!-- Vista exterior del cerebro (imagen vintage) -->
        <div id="brain-view">
            <img src="https://thumbs.dreamstime.com/b/illustra-lateral-del-grabado-vintage-dibujo-de-la-mano-opini%C3%B3n-cerebro-humano-118610006.jpg" alt="Cerebro Vintage" id="brain-image">
            <p class="instruccion">Toca el cerebro para entrar</p>
        </div>

        <!-- Vista interior: Red Neuronal con impulsos eléctricos -->
        <div id="neurons-view" class="oculto">
            <svg id="red-neuronal" width="100%" height="100%">
                <defs>
                    <filter id="brillo-celular" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
            </svg>
        </div>

        <!-- Modal para mostrar los versículos -->
        <div id="verse-modal" class="oculto">
            <div class="modal-content">
                <h2 id="verse-title">Referencia</h2>
                <p id="verse-text">Texto del versículo...</p>
                <button id="btn-continuar">Continuar</button>
            </div>
        </div>

        <!-- Modal Final: Mente Renovada -->
        <div id="final-modal" class="oculto">
            <div class="modal-content final-content">
                <h2>¡Mente Renovada!</h2>
                <img src="https://thumbs.dreamstime.com/b/illustra-lateral-del-grabado-vintage-dibujo-de-la-mano-opini%C3%B3n-cerebro-humano-118609981.jpg" alt="Mente Renovada por la Palabra" id="final-image">
                <p>Tu mente ha sido transformada y renovada por el poder de la Palabra de Dios.</p>
                <button onclick="location.reload()">Volver a empezar</button>
            </div>
        </div>

        <!-- Canvas para el confeti -->
        <canvas id="confetti-canvas"></canvas>

    </div>

    <script src="app.js"></script>
</body>
</html>
